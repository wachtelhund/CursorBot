name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_args: --mac --arm64 --x64
          - os: ubuntu-latest
            electron_args: --linux
          - os: windows-latest
            electron_args: --win

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Test
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm test

      # Unsigned on purpose (no Apple Developer cert). On macOS, Gatekeeper then
      # shows “Cursor Bots is damaged and can’t be opened” — quarantine, not a
      # corrupt binary. Users: Cancel (do not Trash), then
      # xattr -cr "/Applications/Cursor Bots.app"
      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm run build
          npx electron-builder ${{ matrix.electron_args }} --publish never

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cursor-Bots-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
